'取数失败':{title:'库存接口暂时不可用',detail:'已自动重试 1 次，仍未取得可信快照。本次分析转为待人工核查。',next:'记录核查单并等待数据恢复',action:'转人工核查'},
'分析超时':{title:'分析超过 90 秒',detail:'库存校验与风险识别已完成；归因与建议尚未完成。先保留阶段结果。',next:'继续分析或稍后从当前预警恢复',action:'继续分析'},
'低置信度':{title:'证据存在冲突',detail:'库存台账显示 168 件，仓库回传显示 142 件；可售库存无法确认。暂不生成可审批建议。',next:'人工核对库存后重新分析',action:'转人工复核'}
};
function failure(){let f=scenarios[state.scenario];return `${header('异常状态','风险判断需要可信数据；以下状态可切换查看处理路径。',btn('返回预警','to-list'))}<div class="split"><div class="card pad"><h3 class="section-title">场景选择</h3><div class="scenario-list">${Object.keys(scenarios).map(n=>`<button data-scenario="${n}" class="${state.scenario===n?'active':''}"><strong>${n}</strong><span class="small muted" style="display:block;margin-top:3px">${scenarios[n].title}</span></button>`).join('')}</div></div><div class="card pad"><span class="badge warn">分析已暂停</span><h3 style="font-size:23px;margin:17px 0 8px">${f.title}</h3><p class="muted" style="line-height:1.7;font-size:14px">${f.detail}</p><div class="hint amber"><b>下一步：</b>${f.next}</div><div style="margin-top:22px" class="actions">${btn(f.action,'failure-action','primary')}${btn('查看原始证据','evidence')}${btn('恢复标准样例','resume-sample')}</div><p class="small muted" style="margin-top:24px">暂停条件：缺关键证据、时点不一致、权限不足、低置信度或建议失效时，不生成可审批动作。</p></div></div>`}
function dialog(){if(!state.dialog)return '';let ignore=state.dialog==='ignore',submit=state.dialog==='submit',track=state.dialog==='track';return `<div class="dialog-backdrop"><div class="dialog"><h3>${ignore?'标记误报':submit?'二次确认':track?'审批跟踪':'批量指派'}</h3><p>${ignore?'选定误报原因后，预警将进入治理记录。':submit?`确认提交 ${cur().action}？提交后只生成审批单，执行仍需审批通过。`:track?state.approvalNo?`审批单 ${state.approvalNo} · 当前状态：${state.approval}。执行回写与效果验证完成后，预警才能标记已解决。`:'当前没有审批单。':'将选中的预警指派给库存计划员。'}</p>${ignore?'<select id="reason"><option value="">请选择原因</option><option>库存口径问题</option><option>活动未同步</option><option>数据延迟</option><option>阈值不合理</option></select>':''}<div class="actions">${btn('取消','close-dialog')}${track?'':btn(ignore?'确认标记':submit?'确认提交':'确认指派','confirm-dialog','primary')}</div></div></div>`}
function chat(){if(!state.chatOpen)return '';return `<div class="chat"><div class="chathead"><strong>库存助手 · 当前范围</strong><button data-action="toggle-chat" aria-label="关闭">×</button></div><div class="chatbody" id="chatbody">${state.messages.map(m=>`<div class="bubble ${m.role}">${safe(m.text)}</div>`).join('')}</div><div class="chatprompts">${['哪个 SKU 快断货了？','为什么会预警？','建议怎么处理？','审批到哪一步？'].map(p=>`<button data-prompt="${p}">${p}</button>`).join('')}</div><form id="chatform" class="chatinput"><input id="chattext" type="text" placeholder="输入库存问题" autocomplete="off"><button class="btn primary" type="submit">发送</button></form></div>`}
function render(){let noSelection=state.screen>=2&&state.screen<=6&&!scoped().some(a=>a.id===state.selected);let body=noSelection?`${header('当前范围无 SKU','请调整品牌、店铺或仓库范围。',btn('返回预警','to-list'))}<div class="card empty">该范围没有可分析的预警。</div>`:[overview,list,detail,evidence,attribution,suggestion,approval,failure][state.screen]();document.getElementById('app').innerHTML=`<div class="app">${nav()}<main class="main">${topbar()}<div class="content">${state.scenarioActive&&state.screen!==7?`<div class="notice">当前为${state.scenario}模拟场景：页面中的标准样例数值仅供对照，不用于生成建议或审批。请在 S8 复核后恢复标准样例。</div>`:''}${body}</div></main></div><button class="assistant-toggle" data-action="toggle-chat">✦ 问库存助手</button>${chat()}${dialog()}${state.toast?`<div class="toast">${state.toast}</div>`:''}`;document.querySelectorAll('[data-field]').forEach(el=>{el.value=state[el.dataset.field]});if(state.chatOpen){let b=document.getElementById('chatbody');b.scrollTop=b.scrollHeight}}
function go(n){state.screen=n;if(n===7){state.scenarioActive=true;if(state.scenario==='数据延迟')state.snapshot='2026-11-14 23:00'}state.dialog='';window.scrollTo(0,0);render()}
let toastTimer;function toast(s){state.toast=s;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},2800)}
function answer(q){let inScope=scoped();if(state.scenarioActive)return `当前为${state.scenario}场景，关键证据尚未复核。我会暂停归因、调拨建议和审批；请在 S8 查看不确定部分及人工复核路径。`;if(!inScope.length)return '当前范围没有可分析的预警，请调整品牌、店铺或仓库。';let a=inScope.find(z=>z.id===state.selected)||inScope[0],x=q.toLowerCase();if(/为什么|归因|原因/.test(x))return `${a.sku} 的${a.type}主要由${a.cause[0][0]}（${a.cause[0][1]}%）驱动；其余原因和证据见 S5 归因页。当前库存证据为 ${a.evidence}，口径 v1.2。`;if(/建议|怎么办|处理|调拨|补货/.test(x))return a.id==='A-1042'?`建议 B 仓向 A 店调拨 120 件，预计 2 天到达，费用 ¥480。预计避免 96 件缺货，按每件贡献毛利 ¥45 估算，净影响约 ¥3,840。需品牌负责人审批；库存变化超过 20% 时重算。可进入 S6 查看。`:`${a.sku} 当前建议为“${a.action}”。先复核证据与成本，再进入 S6 查看处置条件。`;if(/审批|单号|撤销|跟踪/.test(x))return state.approvalNo?`审批单 ${state.approvalNo} 当前为${state.approval}。审批通过后仍需执行回写与效果验证。`:'当前未发起审批。请先在 S6 查看建议，再到 S7 核对并提交。';if(/风险|断货|哪个|库存|sku|还能卖/.test(x)){let p=scoped().filter(z=>z.priority==='P0')[0];return p?`${p.sku} ${p.name} 是当前范围最高优先级。可售 ${p.stock} 件，日销 ${p.daily} 件，覆盖 7 天；供应商 11 天后到货，预计到货前缺口 96 件。点击 S3 查看详情。`:'当前筛选范围无 P0 预警。可在 S2 查看其他级别。'}return '我能回答当前范围的风险、归因、建议和审批状态。请说明 SKU 或选择上方问题。'}
function submitChat(q){q=q.trim();if(!q)return;state.messages.push({role:'user',text:q},{role:'agent',text:answer(q)});render()}
document.addEventListener('click',e=>{let n=e.target.closest('[data-screen]');if(n){go(Number(n.dataset.screen));return}let p=e.target.closest('[data-prompt]');if(p){submitChat(p.dataset.prompt);return}let s=e.target.closest('[data-scenario]');if(s){state.scenario=s.dataset.scenario;state.scenarioActive=true;state.snapshot=state.scenario==='数据延迟'?'2026-11-14 23:00':'2026-11-15 09:00';render();return}let c=e.target.closest('[data-check]');if(c){let id=c.dataset.check;state.checks=c.checked?[...new Set([...state.checks,id])]:state.checks.filter(x=>x!==id);render();return}let a=e.target.closest('[data-action]');if(a){switch(a.dataset.action){case'check-all':state.checks=e.target.checked?visible().map(z=>z.id):[];render();break;case'to-list':go(1);break;case'focus-detail':state.selected=scoped().find(z=>z.priority==='P0')?.id||state.selected;go(2);break;case'detail':go(2);break;case'evidence':go(3);break;case'attribution':go(4);break;case'suggestion':go(5);break;case'approval':go(6);break;case'low-confidence':state.scenario='低置信度';go(7);break;case'failure':go(7);break;case'resume-sample':state.scenarioActive=false;state.snapshot='2026-11-15 09:00';state.scenario='数据延迟';go(0);break;case'assign':if(!state.checks.length)toast('请先选择预警');else{state.dialog='assign';render()}break;case'ignore':if(!state.checks.length)toast('请先选择预警');else{state.dialog='ignore';render()}break;case'close-dialog':state.dialog='';render();break;case'confirm-dialog':if(state.dialog==='submit'&&(state.scenarioActive||state.snapshot!=='2026-11-15 09:00')){state.dialog='';toast('证据未复核，暂停审批');return}if(state.dialog==='ignore'){let reason=document.getElementById('reason').value;if(!reason){toast('请选择误报原因');return}state.checks.forEach(id=>{let z=alerts.find(a=>a.id===id);z.status='误报关闭'});state.checks=[];state.dialog='';toast('已记录误报原因：'+reason)}else if(state.dialog==='assign'){state.checks.forEach(id=>{let z=alerts.find(a=>a.id===id);z.status='已指派'});state.checks=[];state.dialog='';toast('已指派给库存计划员')}else if(state.dialog==='submit'){state.approval='待审批';state.approvalSeq++;state.approvalNo='AP-20261115-'+String(state.approvalSeq).padStart(3,'0');state.confirmed=false;state.dialog='';toast('审批单已生成：'+state.approvalNo)}break;case'copy-evidence':{let z=cur();navigator.clipboard?.writeText(`证据 ${z.evidence}\n指标 INV.SELLABLE.STOCK\n口径 v1.2：实物 ${z.physical} - 锁定 ${z.locked} - 残次 ${z.damaged} + 可售在途 0 = ${z.stock}\n时间窗：库存 2026-11-15 09:00；销量 2026-10-16 至 11-14，${z.sales30} 件 / 30 日 = ${z.daily} 件/日；普通在途 ${z.transit} 件不计入可售\n数据源：库存台账、订单锁定表、质检残次表、销售明细、采购单\n血缘：仓库实物→扣锁定/残次→当前仓可售；销售明细→日销基准\n取数：2026-11-15 09:05 中国标准时间`);toast('证据已复制');break}case'submit-approval':if(state.scenarioActive||state.snapshot!=='2026-11-15 09:00')toast('证据未复核，暂停审批');else if(REVIEW_AT>'2026-11-15 18:00')toast('建议已过期，请重新计算');else if(cur().id!=='A-1042')toast('数量或成本待复核，暂停审批');else if(!state.confirmed)toast('请先勾选核对确认');else if(state.approval==='待审批')toast('审批单已存在');else{state.dialog='submit';render()}break;case'cancel-approval':if(!state.approvalNo)toast('当前没有可撤销的审批');else if(state.approval==='已撤销')toast('审批已撤销');else{state.approval='已撤销';state.confirmed=false;toast('审批已撤销，未触发执行')}break;case'track':state.dialog='track';render();break;case'failure-action':toast(state.scenario==='数据延迟'?'已发起重新取数；等待新快照':state.scenario==='无数据'?'请在顶部切换店铺或仓库':state.scenario==='分析超时'?'已从阶段结果继续分析':'已生成待人工核查记录');break;case'toggle-chat':state.chatOpen=!state.chatOpen;render();break}return}let row=e.target.closest('[data-open]');if(row){state.selected=row.dataset.open;go(2)}});
document.addEventListener('change',e=>{let f=e.target.dataset.field;if(f){state[f]=e.target.value;if(['brand','shop','warehouse'].includes(f)){state.checks=[];let inScope=scoped();if(inScope.length&&!inScope.some(a=>a.id===state.selected))state.selected=inScope[0].id}if(f==='snapshot'&&state.snapshot==='2026-11-14 23:00'){state.scenario='数据延迟';go(7)}else if(f==='snapshot'&&state.scenarioActive&&state.scenario==='数据延迟'){state.scenarioActive=false;render()}else render()}if(e.target.id==='confirm'){state.confirmed=e.target.checked}});
document.addEventListener('input',e=>{if(e.target.dataset.field==='search'){state.search=e.target.value;let pos=e.target.selectionStart;render();let input=document.querySelector('[data-field=search]');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='chatform'){e.preventDefault();submitChat(document.getElementById('chattext').value)}});
render();
</script></body></html>
