    const max = Math.max(...rawValues,1), min = Math.min(...rawValues,0), span = max-min || 1;
    const plotted = values.map(point => ({ ...point, x: 40+point.index*140, y: 90-(point.value-min)/span*62 }));
    const points = plotted.map(point=>`${point.x},${point.y}`).join(' ');
    document.getElementById('content').innerHTML = `<p class="shop">${esc(report.shopName)}</p><h1>经营巡检日报</h1><p class="muted">查看昨日经营变化，优先处理重要问题</p><div class="date-picker"><button data-toggle-calendar aria-expanded="${calendarOpen}">日期：${date} ▾</button>${calendarOpen ? renderDateCalendar(date, data.reports.map(row=>row.date), 'data-date', '') : ''}</div>
      <div class="scope">数据范围 ${date} 00:00–24:00 · 已覆盖 ${report.completeness}<br>本店已授权数据 · ${report.simulatedRunAt.slice(5,16)} 更新</div>${report.missing.length?`<p class="warning">${esc(report.missing.join('、'))}数据待补充，相关变化暂无法判断。</p>`:''}
      <div class="summary"><small>今日重点</small><p>${esc(report.summary)}</p></div><div class="grid">${Object.entries(report.metrics).map(([id,item])=>`<button class="kpi ${id===selected?'active':''}" data-metric="${id}"><span>${labels[id]}</span><b>${item.value==null?'待更新':`${id==='transaction'?'¥':id==='ranking'?'第 ':''}${num(item.value)}${id==='ranking'?' 名':''}`}</b><small>点击查看趋势与依据</small></button>`).join('')}</div>
      <div class="panel"><h2>${labels[selected]} · 近三日趋势与明细</h2>${plotted.length ? `<svg class="trend" viewBox="0 0 360 130" role="img" aria-label="截至${date}的近三日指标趋势"><path d="M40 100 H320" stroke="#e4e9ef"/>${plotted.length > 1 ? `<polyline points="${points}" stroke="#df241b" stroke-width="3" fill="none"/>` : ''}${plotted.map(point=>`<circle cx="${point.x}" cy="${point.y}" r="4" fill="#df241b"/><text x="${point.x}" y="${point.y-15}" text-anchor="middle" font-size="11" fill="#596b80">${num(point.value)}</text>`).join('')}${windowReports.map((row,index)=>`<text x="${40+index*140}" y="122" text-anchor="middle" font-size="10" fill="#7b8998">${row.date.slice(5)}</text>`).join('')}</svg>` : '<p class="muted">该指标暂缺可比较的趋势数据。</p>'}${detail}${evidence(metric.evidence)}</div>
      <div class="layout"><section class="panel"><h2>优先关注</h2>${report.alerts.length?report.alerts.map(alert=>`<details data-alert="${alert.incidentId}"><summary>${esc(alert.title)} <span class="badge">${statuses[currentFeedback(alert.incidentId)?.status||'pending']}</span></summary><p>${esc(alert.action)}</p>${line('变化',`${num(alert.gap)} ${alert.kind==='ranking'?'位':'人'}`)}${line('关注条件',alert.threshold)}${line('仍需核验',alert.exclusion)}${evidence(alert.evidence)}</details>`).join(''):'<p class="muted">已更新指标暂未触发新的异常。</p>'}
      ${report.followups.length?`<h2 style="margin-top:25px">上次问题的后续变化</h2>${report.followups.map(row=>`<div class="follow"><b>${esc(row.title)} · ${statuses[currentFeedback(row.incidentId)?.status||'pending']}</b>缺口 ${num(row.previousGap)} → ${num(row.currentGap)} 人<br><small>${row.recoveryStatus==='ongoing'?'仍需继续关注':'已低于提醒阈值，继续观察'}；处理与恢复分别核实。</small></div>`).join('')}`:''}</section>
      <section class="panel"><h2>今日待办与处理记录</h2>${notice?`<p class="flash" role="status">${notice}</p>`:''}${report.tasks.map(task=>{const feedback=currentFeedback(task.incidentId);return `<div class="task"><strong>${esc(task.title)}</strong><div class="form"><select aria-label="处理状态" data-status="${task.incidentId}">${Object.entries(statuses).map(([key,label])=>`<option value="${key}" ${(feedback?.status||'pending')===key?'selected':''}>${label}</option>`).join('')}</select><input aria-label="处理备注" maxlength="300" data-note="${task.incidentId}" placeholder="补充处理情况" value="${esc(feedback?.note||'')}"></div><button class="save" data-feedback="${task.incidentId}">保存处理记录</button></div>`;}).join('')||'<p class="muted">暂无需要处理的事项。</p>'}</section></div>`;
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.toggleCalendar !== undefined){calendarOpen=!calendarOpen;render();}
    else if(button.dataset.date){date=button.dataset.date;calendarOpen=false;notice='';render();}
    else if(button.dataset.metric){selected=button.dataset.metric;render();}
    else if(button.dataset.feedback){
      const id=button.dataset.feedback,status=document.querySelector(`[data-status="${id}"]`).value,note=document.querySelector(`[data-note="${id}"]`).value.slice(0,300);
      const revision=1+Math.max(0,...revisions.filter(item=>item.incidentId===id).map(item=>item.revision||0));
      revisions.unshift({incidentId:id,status,note,sourceDate:date,createdAt:new Date().toISOString(),revision});
      try{localStorage.setItem(storageKey,JSON.stringify(revisions));}catch{}
      notice='处理记录已保存';render();
    }
  });
  render();
})();</script></body></html>
